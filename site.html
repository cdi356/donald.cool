<!DOCTYPE html>
<html>
<head>
    <title>donald.cool</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
</head>

<body>

<div id="overlay">
    <div class="login">

        <h1>donald.cool</h1>
        <p>site currently in progress</p>

        <div class="password-box" id="password-box">
            <input
                    id="password"
                    type="password"
                    placeholder="password"
                    autofocus
            >
            <button class="enter-btn" onclick="unlock()">-></button>
        </div>

    </div>
</div>

<main id="site">
    <div class="window">
        <div class="window-bar">
            <span>donald.cool</span>
            <div class="window-buttons">
                <span>_</span>
                <span>□</span>
                <span>×</span>
            </div>
        </div>

        <div class="inner-window">
            <div class="tabs">
                <button class="tab active">about</button>
                <button class="tab">music</button>
                <button class="tab">cool stuff</button>
            </div>

            <div class="content">
                <h1>donald.cool</h1>
                <p>
                    all your stuff goes here
                </p>
            </div>
        </div>

    </div>
</main>

<script src="js/main.js"></script>
</body>

</html>
